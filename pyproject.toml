[project]
name = "zegocover-test"
version = "0.1.0"
description = "A bounded asynchronous crawler with multiple seeds and configurable hostname scope"
readme = "README.md"
authors = [
    { name = "Martin", email = "17749252+martin-mok@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
zegocover-test = "zegocover_test.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
